name: Deploy PHP site (manual)

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Upload site to PHP hosting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy files over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /htdocs/
          protocol: ftp
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/.env*
            **/config.local.php
            **/*.sql
            **/*.md

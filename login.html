<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Entrar | Meraky Admin</title><link rel="stylesheet" href="style.css">
<style>
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#f8f9fa}
.login-card{width:min(100%,420px);background:#fff;border:1px solid #e5e7eb;border-radius:18px;padding:32px;box-shadow:0 18px 55px rgba(15,23,42,.08)}
.login-brand{display:flex;align-items:center;gap:12px;margin-bottom:28px}.login-brand .brand-mark{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:#0f172a;color:#67e8f9;font-weight:800}
.login-card h1{font-size:1.65rem;margin:0 0 8px}.login-card .muted{margin:0 0 24px}.login-card label{display:block;margin:16px 0 7px;font-weight:600}
.login-card input{width:100%;padding:13px 14px;border:1px solid #cbd5e1;border-radius:10px;font:inherit}.login-card button{width:100%;margin-top:22px;justify-content:center}
.login-error{min-height:22px;color:#b91c1c;font-size:.9rem;margin-top:12px}.login-note{font-size:.82rem;color:#64748b;margin-top:20px;line-height:1.5}
</style></head>
<body><main class="login-card">
<div class="login-brand"><span class="brand-mark">M</span><div><strong>Meraky</strong><br><small>Administração</small></div></div>
<h1>Acessar painel</h1><p class="muted">Entre com as credenciais do administrador.</p>
<form id="loginForm"><label for="usuario">Usuário</label><input id="usuario" name="usuario" autocomplete="username" required maxlength="80">
<label for="senha">Senha</label><input id="senha" name="senha" type="password" autocomplete="current-password" required>
<button class="primary-btn" id="entrar" type="submit">Entrar</button><p class="login-error" id="erro" role="alert"></p></form>
<p class="login-note">Acesso restrito. As credenciais são configuradas nas variáveis de ambiente do servidor e não ficam armazenadas neste repositório.</p>
</main><script src="login.js"></script></body></html>
